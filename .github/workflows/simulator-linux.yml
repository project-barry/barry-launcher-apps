# Barry Simulator for Linux: an AppImage for x86_64 and aarch64, built
# (tools/sim/linux/build-linux.sh), tried under Xvfb with the Stardew Dual
# Screen and Pip-Boy apps and their stand-in games, and released on
# simulator-v* tags.
name: Barry Simulator (Linux)

on:
  push:
    branches: [main, "sim-*"]
    tags: ["simulator-v*"]
    paths: ["tools/sim/**", "tools/barry_apps.py", "tools/AppHost.qml", ".github/workflows/simulator-linux.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04      # the oldest glibc the AppImage can be built on: wide reach
            arch: x86_64
          - runner: ubuntu-24.04-arm  # PySide6's aarch64 build needs glibc 2.39
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Qt's libraries, and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 xvfb >/dev/null
      - name: Build
        run: tools/sim/linux/build-linux.sh dist
      - name: Apps to try
        run: |
          mkdir try-apps
          git clone -q --depth 1 https://github.com/project-barry/stardew-dual-screen.git try-apps/stardew-dual-screen
          git clone -q --depth 1 https://github.com/project-barry/PyPipboyApp.git try-apps/PyPipboyApp
      - name: Try Stardew Dual Screen and Pip-Boy (X11, under Xvfb)
        run: |
          app=dist/AppDir-${{ matrix.arch }}
          export LD_LIBRARY_PATH=$app/lib QT_QPA_PLATFORM=xcb PYTHONNOUSERSITE=1
          xvfb-run -a -s "-screen 0 1920x1200x24" $app/python/bin/python3 $app/sim/selftest.py $app/sim try-apps shots "Stardew Dual Screen" "app connected"
          xvfb-run -a -s "-screen 0 1920x1200x24" $app/python/bin/python3 $app/sim/selftest.py $app/sim try-apps shots "Pip-Boy" "connected to 127.0.0.1"
      - name: The AppImage starts
        run: |
          img=dist/Barry-Simulator-${{ matrix.arch }}.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a $img > appimage.log 2>&1 &
          sleep 20
          cat appimage.log
          pgrep -f "sim/sim.py" || { echo "the simulator is not running"; exit 1; }
          pkill -f "sim/sim.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.arch }}
          path: shots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: Barry-Simulator-${{ matrix.arch }}.AppImage
          path: dist/Barry-Simulator-${{ matrix.arch }}.AppImage
          compression-level: 0
      - name: Release
        if: startsWith(github.ref, 'refs/tags/simulator-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --latest=false \
            --title "Barry Simulator ${TAG#simulator-}" --notes-file tools/sim/release-notes.md || true
          gh release upload "$TAG" dist/Barry-Simulator-${{ matrix.arch }}.AppImage --clobber
